[project]
name = "pagereuse-lab"
version = "0.1.0"
description = "Controlled experiments on PostgreSQL heap page reuse"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pagereuse"]

[tool.setuptools.package-data]
pagereuse = ["web/*"]
