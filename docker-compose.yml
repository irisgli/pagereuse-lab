services:
  postgres:
    image: postgres:16.4
    container_name: pagereuse-pg
    environment:
      POSTGRES_USER: pagereuse
      POSTGRES_PASSWORD: pagereuse
      POSTGRES_DB: pagereuse_lab
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagereuse -d pagereuse_lab"]
      interval: 1s
      timeout: 3s
      retries: 30
